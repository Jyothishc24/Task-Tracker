plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()  // Required for JUnit 5
}

application {
    mainClass = 'com.example.Main'
}

jar {
    manifest {
        attributes(
            'Main-Class': mainClassName
        )
    }
}

